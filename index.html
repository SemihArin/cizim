<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#3d8bff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>çizim</title>
<script>
/* tek dosya PWA: manifest ve ikonlar burada üretiliyor */
(function(){
  function ico(n,mask){
    var c=document.createElement('canvas'); c.width=c.height=n; var x=c.getContext('2d'), k=mask?.78:1;
    x.fillStyle='#3d8bff'; x.fillRect(0,0,n,n);
    [[.44,.13],[.34,.15],[.24,.18]].forEach(function(r){ x.fillStyle='rgba(255,255,255,'+r[1]+')'; x.beginPath(); x.arc(n/2,n/2,n*r[0]*k,0,7); x.fill(); });
    x.fillStyle='#fff'; x.beginPath(); x.arc(n/2,n/2,n*.15*k,0,7); x.fill();
    return c.toDataURL('image/png');
  }
  var base=location.href.split('#')[0].split('?')[0], scope=base.slice(0,base.lastIndexOf('/')+1);
  var m={name:'çizim',short_name:'çizim',id:base,start_url:base,scope:scope,display:'standalone',orientation:'any',
    background_color:'#3d8bff',theme_color:'#3d8bff',
    icons:[{src:ico(192),sizes:'192x192',type:'image/png',purpose:'any'},{src:ico(512),sizes:'512x512',type:'image/png',purpose:'any'},{src:ico(512,1),sizes:'512x512',type:'image/png',purpose:'maskable'}]};
  var l=document.createElement('link'); l.rel='manifest'; l.href='data:application/manifest+json;charset=utf-8,'+encodeURIComponent(JSON.stringify(m)); document.head.appendChild(l);
  var a=document.createElement('link'); a.rel='apple-touch-icon'; a.href=ico(180); document.head.appendChild(a);
  var f=document.createElement('link'); f.rel='icon'; f.href=ico(64); document.head.appendChild(f);
})();
</script>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
:root{
  --b:#3d8bff;--bd:#2c78f0;--bl:#6aa8ff;--l:#e3efff;--l2:#f2f7ff;--ink:#16325c;--mut:#93b3dc;--s:#1f6fe8;--red:#ff5470;--e:#4fb8ff;
  --R:28px;--sb:env(safe-area-inset-bottom);--st:env(safe-area-inset-top);
  --spring:cubic-bezier(.3,1.2,.4,1);--exit:cubic-bezier(.4,0,1,1);--move:cubic-bezier(.65,0,.35,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0b1f3f;font-family:Fredoka,system-ui,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
input{-webkit-user-select:text;user-select:text}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}

/* SPLASH */
#splash{position:fixed;inset:0;z-index:100;background:var(--b);display:grid;place-items:center}
#splash .orb{width:0;height:0;position:relative;animation:spin 1.4s linear infinite}
#splash .d{position:absolute;left:-22px;top:-22px;width:44px;height:44px;border-radius:50%;background:#fff}
@keyframes spin{to{transform:rotate(360deg)}}

/* KABUK */
.app{position:fixed;inset:0;overflow:hidden;background:var(--l2);transform-origin:50% 100%;transition:transform .6s var(--spring)}
.app.back{transform:scale(.92) translateY(-10px)}
.app.rnd{border-radius:var(--R)}
.view{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}

/* SÜRE */
#vTime{background:var(--b);color:#fff;z-index:2;transition:background .8s var(--move)}
#vTime.st-run{background:var(--bd)}
#vTime.need{background:var(--red);transition:background .35s ease}
.top{flex:1;position:relative;display:grid;place-items:center;padding-top:var(--st)}
.top>*{grid-area:1/1}
.rings{width:min(84vw,340px);aspect-ratio:1;position:relative;animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.025)}}
.spi{position:absolute;inset:-6%;width:112%;height:112%;overflow:visible;opacity:0;will-change:transform,opacity;pointer-events:none}
.spi path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.glow{position:absolute;inset:0;pointer-events:none}
.rg{position:absolute;border-radius:50%;background:rgba(255,255,255,.09);will-change:transform}
.rg.r1{inset:0}.rg.r2{inset:13%}.rg.r3{inset:26%}
.tbox{text-align:center;will-change:transform}
.t{font-size:clamp(64px,20vw,92px);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-1px;line-height:1;display:flex;justify-content:center}
.sl{display:inline-grid;line-height:1}
.sl>span{grid-area:1/1;will-change:transform,opacity}
.sl.c{margin:0 .02em;transform:translateY(-.04em)}
.cs{font-size:24px;font-weight:500;opacity:.55;font-variant-numeric:tabular-nums;margin-top:6px}
#cd{font-size:min(42vw,170px);font-weight:700;opacity:0;pointer-events:none;line-height:1;will-change:transform,opacity}

.ctl{position:relative;height:220px;margin-bottom:calc(var(--sb) + 86px)}
#cv{position:absolute;inset:0;width:100%;height:100%}
.cb{position:absolute;left:0;top:0;width:140px;height:140px;border-radius:50%;display:grid;place-items:center;color:#fff;transition:color .3s;will-change:transform}
.cb.w{color:var(--s)}.cb.w.r{color:var(--red)}.cb.w.e{color:var(--e)}
.cb>*{grid-area:1/1}
.cc{display:flex;flex-direction:column;align-items:center;gap:2px}
.cc b{font-size:42px;font-weight:700;line-height:1}
.cc span{font-size:15px;font-weight:600;opacity:.85}
.cb svg.ic{width:42px;height:42px}
.bdg{place-self:start end;margin:10px;width:34px;height:34px;border-radius:50%;background:currentColor;display:grid;place-items:center;transform:scale(0);transition:transform .5s var(--spring)}
.bdg svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.cb.ok .bdg{transform:none}

/* ÇİZİMLER */
#vArc{background:var(--l2);z-index:1;visibility:hidden}
.hd{padding:calc(var(--st) + 18px) 18px 12px;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2;background:var(--l2)}
.hd::after{content:"";position:absolute;left:18px;right:18px;bottom:0;height:2px;border-radius:2px;background:var(--l);opacity:var(--p,0)}
.hd h1{font-size:32px;font-weight:700}
.lq{position:relative;display:flex;background:var(--l);border-radius:99px;padding:4px}
.lq .ind{position:absolute;left:0;top:4px;bottom:4px;width:0;border-radius:99px;background:#fff;will-change:transform}
.lq button{position:relative;height:36px;min-width:42px;padding:0 13px;border-radius:99px;font-weight:600;font-size:14px;color:var(--mut);transition:color .3s}
.lq button.on{color:var(--s)}
.list{flex:1;overflow-y:auto;padding:0 14px calc(var(--sb) + 110px);-webkit-overflow-scrolling:touch}
.day{margin-top:18px}
.day h2{font-size:15px;font-weight:500;color:var(--mut);margin:0 6px 10px}
.day h2 b{color:var(--ink);font-weight:600;margin-right:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cd{position:relative;border-radius:var(--R);overflow:hidden;background:#fff;aspect-ratio:1;cursor:pointer;transform:translateZ(0)}
.cd img{width:100%;height:100%;object-fit:cover;display:block}
.tg{position:absolute;left:10px;bottom:10px;display:flex;align-items:center;gap:6px;background:#fff;border-radius:99px;padding:4px 10px 4px 4px;font-size:13px;font-weight:600}
.av{border-radius:50%;display:grid;place-items:center;color:#fff;font-style:normal;font-weight:700}
.tg .av{width:22px;height:22px;font-size:11px}
.tg em{font-style:normal;color:var(--mut);font-weight:500;font-variant-numeric:tabular-nums}
.av.semih{background:var(--s)}.av.ecrin{background:var(--e)}
.none{height:60vh;display:grid;place-items:center;color:var(--l)}
.none svg{width:110px}

/* ALT */
.tabs{transition:transform .6s var(--spring);position:absolute;left:50%;bottom:calc(var(--sb) + 14px);margin-left:-84px;width:168px;height:64px;border-radius:99px;background:#fff;padding:8px;display:flex;z-index:5}
.tabs .ind{top:8px;bottom:8px;background:var(--b)}
.tab{position:relative;flex:1;display:grid;place-items:center;color:#b9cfee;transition:color .3s}
.tab svg{width:26px;height:26px}
.tabs .tab{height:48px;padding:0;color:#b9cfee}
.tabs .tab.on{color:#fff}
.fab{position:absolute;right:16px;bottom:calc(var(--sb) + 14px);width:64px;height:64px;border-radius:50%;background:var(--b);color:#fff;display:grid;place-items:center;z-index:5;transform:scale(0);transition:transform .5s var(--spring)}
.fab.on{transform:none}
.fab svg{width:28px;height:28px}
.press:active{transform:scale(.92)!important;transition:transform .12s}

/* SHEET */
.ov{position:fixed;inset:0;background:rgba(5,20,45,.4);z-index:30;opacity:0;pointer-events:none;transition:opacity .45s}
.ov.on{opacity:1;pointer-events:auto}
.sh{position:fixed;left:0;right:0;bottom:0;z-index:31;background:#fff;border-radius:var(--R) var(--R) 0 0;padding:12px 20px calc(var(--sb) + 20px);transform:translateY(110%);max-width:600px;margin:0 auto;transition:transform .35s var(--exit);will-change:transform}
.sh.on{transform:none;transition:transform .7s var(--spring)}
.grab{width:44px;height:5px;border-radius:99px;background:var(--l);margin:0 auto 14px}
#who{display:grid;grid-template-columns:1fr 1fr;padding:5px}
#who .ind{top:5px;bottom:5px}
#who button{height:48px;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px}
#who .av{width:26px;height:26px;font-size:12px;background:var(--mut);transition:background .3s}
#who button.on .av.semih{background:var(--s)}#who button.on .av.ecrin{background:var(--e)}
.pick{margin-top:12px;height:min(40vh,320px);border-radius:20px;background:var(--l2);display:grid;place-items:center;overflow:hidden;position:relative;color:#bcd4f2}
.pick svg{width:54px;height:54px}
.pick img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--l2)}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.mini input{height:52px;border-radius:99px;border:0;background:var(--l2);font:inherit;font-size:16px;font-weight:500;color:var(--ink);text-align:center;outline:none;width:100%;-webkit-appearance:none;appearance:none}
.sv{position:relative;overflow:hidden;width:100%;height:60px;margin-top:12px;border-radius:99px;background:var(--b);color:#fff;font-size:19px;font-weight:600;transition:background .3s}
.sv:disabled{background:var(--l)}
.sv span{transition:opacity .3s}
.sv.busy span{opacity:.35}
.sv.busy::after{content:"";position:absolute;top:0;bottom:0;left:0;width:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:shim 1s linear infinite}
@keyframes shim{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

/* AYAR */
.st{z-index:32}
.prof{display:flex;align-items:center;gap:14px;padding:4px 4px 14px}
.pav{width:56px;height:56px;border-radius:50%;overflow:hidden;display:grid;place-items:center;color:#fff;font-weight:700;font-size:22px;flex:none}
.pav img{width:100%;height:100%;object-fit:cover}
.prof b{display:block;font-size:20px;font-weight:600}
.prof small{color:var(--mut);font-size:14px}
.opt{display:flex;align-items:center;justify-content:space-between;min-height:60px;padding:0 6px 0 18px;margin-top:8px;border-radius:99px;background:var(--l2);font-weight:500;font-size:16px}
.opt.col{flex-direction:column;align-items:stretch;gap:10px;padding:14px;border-radius:var(--R)}
.opt.col>span{padding-left:4px}
.sw{width:56px;height:48px;display:grid;place-items:center}
.sw::before{content:"";grid-area:1/1;width:52px;height:32px;border-radius:99px;background:#cfe0f7;transition:background .3s}
.sw i{grid-area:1/1;width:26px;height:26px;border-radius:50%;background:#fff;transform:translateX(-10px);transition:transform .5s var(--spring)}
.sw.on::before{background:var(--b)}
.sw.on i{transform:translateX(10px)}
#animSeg{background:#fff}
#animSeg .ind{background:var(--b)}
#animSeg button{flex:1;padding:0 6px;color:var(--mut)}
#animSeg button.on{color:#fff}
#animSeg svg{width:22px;height:22px;fill:currentColor;stroke:currentColor;vertical-align:middle}
#animSeg button[data-a="1"] svg,#animSeg button[data-a="3"] svg{fill:none}
.out{width:100%;height:56px;margin-top:12px;border-radius:99px;background:#fff0f3;color:var(--red);font-weight:600;font-size:17px}
/* VIEWER */
.vw{position:fixed;inset:0;z-index:40;visibility:hidden}
.vw.on{visibility:visible}
.vbg{position:absolute;inset:0;background:#0b1f3f;opacity:0;will-change:opacity}
.vst{position:absolute;left:14px;right:14px;top:calc(var(--st) + 72px);bottom:calc(var(--sb) + 100px);display:grid;place-items:center;touch-action:none}
.vst img{max-width:100%;max-height:100%;border-radius:var(--R);display:block;opacity:0;will-change:transform}
.bar{position:absolute;left:14px;right:14px;bottom:calc(var(--sb) + 18px);display:flex;align-items:center;gap:10px;color:#fff}
.bar>*{opacity:0;will-change:transform}
.nm{flex:1;height:58px;display:flex;align-items:center;gap:10px;font-weight:600;background:rgba(255,255,255,.1);border-radius:99px;padding:0 18px 0 6px}
.nm .av{width:46px;height:46px;font-size:18px}
.nm small{display:block;opacity:.55;font-size:13px;font-weight:400}
.bar a,.bar button{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;color:#fff;flex:none}
.bar svg{width:24px;height:24px}
.vx{position:absolute;top:calc(var(--st) + 14px);right:14px;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;color:#fff;opacity:0}
.vx svg{width:20px;height:20px}

.fly{position:fixed;left:0;top:0;z-index:60;overflow:hidden;pointer-events:none;transform-origin:0 0;will-change:transform}
.fly img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;will-change:transform}
.cover{position:fixed;z-index:50;border-radius:50%;pointer-events:none;will-change:transform}
.net{position:fixed;top:calc(var(--st) + 16px);left:50%;margin-left:-6px;width:12px;height:12px;border-radius:50%;background:#ffb547;z-index:45;transform:scale(0);transition:transform .5s var(--spring);pointer-events:none}
.net.on{transform:none;animation:netp 1.4s ease-in-out infinite}
@keyframes netp{50%{opacity:.4}}
.toast{position:fixed;left:50%;top:calc(var(--st) + 14px);z-index:110;background:var(--ink);color:#fff;font-size:14px;font-weight:500;padding:10px 18px;border-radius:99px;transform:translate(-50%,-120px);transition:transform .5s var(--spring);max-width:90vw;text-align:center;pointer-events:none}
.toast.on{transform:translate(-50%,0)}
.ghost{position:fixed!important;z-index:4;pointer-events:none;margin:0}

/* MASA SAATİ (yatay) */
.app.desk #vTime{flex-direction:row}
.app.desk .top{padding:0 0 0 env(safe-area-inset-left)}
.app.desk .rings{width:min(84vh,58vw)}
.app.desk .t{font-size:min(26vh,15vw)}
.app.desk .cs{font-size:min(6vh,3.4vw)}
.app.desk #cd{font-size:min(50vh,26vw)}
.app.desk .ctl{width:clamp(170px,27%,240px);flex:none;height:auto;margin:0;background:rgba(10,40,100,.12);border-radius:var(--R) 0 0 var(--R);padding-right:env(safe-area-inset-right)}
.app.desk .tabs{transform:translateY(180%)}
.app.desk .fab{transform:scale(0)!important;pointer-events:none}

/* bekleme etiketi */
.wait{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-size:17px;font-weight:600;color:#fff;opacity:0;transform:translateY(16px) scale(.9);transition:opacity .25s,transform .6s var(--spring);pointer-events:none}
.wait.on{opacity:1;transform:none}
.wait span{display:inline-block;animation:wd 1.4s ease-in-out infinite}
@keyframes wd{50%{opacity:.55}}
.app.desk .wait{bottom:24px}
.me{position:absolute;top:calc(var(--st) + 14px);right:14px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;font-weight:700;display:grid;place-items:center;overflow:hidden;z-index:3}
.me img{width:100%;height:100%;object-fit:cover}

/* GİRİŞ */
.gate{position:fixed;inset:0;z-index:90;background:var(--b);display:grid;place-items:center;visibility:hidden}
.gate.on{visibility:visible}
.gate>*{grid-area:1/1}
.gate .rings{width:min(84vw,340px)}
.gbtn{width:124px;height:124px;border-radius:50%;background:#fff;display:grid;place-items:center;will-change:transform}
.gbtn svg{width:54px;height:54px}
.gbtn:disabled{opacity:.8}
.pk{display:flex;gap:26px}
.pk button{width:128px;height:128px;border-radius:50%;background:#fff;display:grid;place-items:center;will-change:transform}
.pk button[data-w=semih]{color:var(--s)}.pk button[data-w=ecrin]{color:var(--e)}
.pk button.taken{opacity:.3;pointer-events:none}
</style>
</head>
<body>
<div id="splash"><div class="orb">
  <div class="d" style="transform:translate(0,-48px)"></div><div class="d" style="transform:translate(42px,24px)"></div><div class="d" style="transform:translate(-42px,24px)"></div>
</div></div>

<div class="app" id="app">
  <section class="view st-idle" id="vTime">
    <div class="top" id="top">
      <div class="glow"></div><div class="rings"><svg class="spi" viewBox="-100 -100 200 200"><g></g></svg><div class="rg r1" id="r1"></div><div class="rg r2" id="r2"></div><div class="rg r3" id="r3"></div></div>
      <div class="tbox" id="tbox"><div class="t" id="tm">00:00</div><div class="cs" id="cs">.00</div></div>
      <div id="cd"></div>
    </div>
    <button class="me" id="meBtn"></button>
    <div class="ctl" id="ctl">
      <div class="wait" id="wait"></div>
      <canvas id="cv"></canvas>
      <button class="cb" id="cA"></button>
      <button class="cb" id="cB"></button>
    </div>
  </section>

  <section class="view" id="vArc">
    <div class="hd" id="hd">
      <h1>çizimler</h1>
      <div class="lq" id="seg"><div class="ind"></div>
        <button class="on" data-f="all">hepsi</button><button data-f="semih">S</button><button data-f="ecrin">E</button>
      </div>
    </div>
    <div class="list" id="list"></div>
  </section>

  <nav class="tabs lq" id="tabs"><div class="ind"></div>
    <button class="tab on" data-v="t"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13.5" r="8"/><path d="M12 9.5v4l2.5 2M10 2.5h4"/></svg></button>
    <button class="tab" data-v="a"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="7" cy="7" r="4"/><circle cx="17" cy="7" r="4"/><circle cx="7" cy="17" r="4"/><circle cx="17" cy="17" r="4"/></svg></button>
  </nav>
  <button class="fab press" id="fab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
</div>

<div class="net" id="net"></div><div class="toast" id="toast"></div>
<section class="gate" id="gLogin">
  <div class="glow"></div><div class="rings"><div class="rg r1"></div><div class="rg r2"></div><div class="rg r3"></div></div>
  <button class="gbtn press" id="gBtn" aria-label="Google ile giriş"><svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg></button>
</section>

const K=230, C=22, STAG=45;
const EXIT='cubic-bezier(.4,0,1,1)', MOVE='cubic-bezier(.65,0,.35,1)';
function springCurve(k,c){
  const a=[]; let x=0,v=0; const dt=1/240;
  for(let i=0;i<4800;i++){ const f=-k*(x-1)-c*v; v+=f*dt; x+=v*dt; if(i%8===0) a.push(x); if(i>60&&Math.abs(v)<.004&&Math.abs(x-1)<.002) break; }
  a.push(1); return {e:'linear('+a.map(n=>n.toFixed(3)).join(',')+')', d:Math.round(a.length*1000/30)};
}
const LIN = window.CSS && CSS.supports('transition-timing-function','linear(0,1)');

class Spr{
  constructor(x,k=K,c=C){ this.x=this.t=x; this.v=0; this.k=k; this.c=c; }
  step(dt){ const f=-this.k*(this.x-this.t)-this.c*this.v; this.v+=f*dt; this.x+=this.v*dt; }
  get done(){ return Math.abs(this.v)<.0008 && Math.abs(this.x-this.t)<.0008; }
  snap(){ this.x=this.t; this.v=0; }
}
const springs=[]; const S=(...a)=>{ const s=new Spr(...a); springs.push(s); return s; };
function springP(onUp){
  return new Promise(res=>{ let x=0,v=0,last=null;
    (function f(t){ if(last==null) last=t; const dt=Math.min(.034,(t-last)/1000); last=t;
      for(let i=0;i<4;i++){ const h=dt/4, F=-K*(x-1)-C*v; v+=F*h; x+=v*h; }
      onUp(x); if(Math.abs(v)<.002&&Math.abs(1-x)<.0015){ onUp(1); res(); } else requestAnimationFrame(f); })(performance.now());
  });
}
/* paylaşılan öğe uçuşu: sadece transform (kompozitör) */
async function fly(src, a, b, ra, rb){
  const f=document.createElement('div'); f.className='fly';
  const im=new Image(); im.src=src; f.appendChild(im);
  try{ await im.decode(); }catch(e){}
  Object.assign(f.style,{width:b.width+'px',height:b.height+'px'});
  document.body.appendChild(f);
  await springP(p=>{
    const w=Math.max(1,lerp(a.width,b.width,p)), h=Math.max(1,lerp(a.height,b.height,p));
    const sx=w/b.width, sy=h/b.height, su=Math.max(sx,sy), r=lerp(ra,rb,Math.min(1,Math.max(0,p)));
    f.style.transform=`translate(${lerp(a.left,b.left,p)}px,${lerp(a.top,b.top,p)}px) scale(${sx},${sy})`;
    f.style.borderRadius=`${r/sx}px / ${r/sy}px`;
    im.style.transform=`scale(${su/sx},${su/sy})`;
  });
  return f;
}

    this.L.t=l; this.R.t=r;

    if(instant){ this.L.snap(); this.R.snap(); this.draw(true); }
  }
  sync(){ const b=this.box.querySelector('button.on')||this.btns[0]; if(b) this.go(b, true); }

function pressReady(){

    return t;
  }).catch(fbErr);
}
/* ortak durdurma: ikisi de basınca durur, herkesin kendi süresi saklanır */
function pressStop(){
  TR.transaction(t=>{
    if(!t||!t.running) return;
    const e=Math.max(0,now()-t.startAt);
    t.dur=t.dur||{}; t.bitti=t.bitti||{};
    if(t.dur[ME]){ delete t.dur[ME]; delete t.bitti[ME]; } else { t.dur[ME]=true; t.bitti[ME]=e; }
    if(t.dur.semih && t.dur.ecrin){ t.running=false; t.son=Math.max(t.bitti.semih,t.bitti.ecrin,1); t.startAt=0; t.dur={}; }

}

const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
function bridge(c1,r1,c2,r2){

  if(r1<1||r2<1||d>(r1+r2)*1.2||d<=Math.abs(r1-r2)) return null;

  const p1=vec(c1,a1,r1),p2=vec(c1,a2,r1),p3=vec(c2,a3,r2),p4=vec(c2,a4,r2);
  const d2=Math.min(v*hs,dist(p1,p3)/(r1+r2))*Math.min(1,d*2/(r1+r2));

      AX(c,[{transform:'none',opacity:1},{transform:'scale(.6)',opacity:0}]).onfinish=()=>{ c.remove(); c.classList.remove('ghost'); c.getAnimations().forEach(a=>a.cancel()); Object.assign(c.style,{left:'',top:'',width:'',height:''}); };
    }else c.remove();
  });
  [...cardEls.keys()].forEach(id=>{ if(!all.has(id)) cardEls.delete(id); });
  if(!L.length){
    list.innerHTML=EMPTY;
    if(anim) A(list.firstChild,[{transform:'scale(.6)',opacity:0},{transform:'none',opacity:1}],{delay:120,fill:'backwards'});
    return;
  }
  const g={}; L.forEach(i=>(g[i.date]=g[i.date]||[]).push(i));
  const frag=document.createDocumentFragment();
  Object.entries(g).forEach(([d,a])=>{
    const [m,s]=dname(d);
    const day=document.createElement('div'); day.className='day'; day.dataset.d=d;
    day.innerHTML=`<h2><b>${m}</b>${s}</h2><div class="grid"></div>`;
    const grid=day.lastChild; a.forEach(i=>grid.appendChild(cardEl(i)));
    frag.appendChild(day);
  });
  list.replaceChildren(frag);
  if(!anim) return;
  let k=0;
  L.forEach(i=>{
    const c=cardEls.get(i.id), b=before.get(i.id), a=c.getBoundingClientRect();
    if(b){ const dx=b.left-a.left, dy=b.top-a.top; if(Math.abs(dx)+Math.abs(dy)>1) A(c,[{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}]); }
    else if(a.top<innerHeight) A(c,[{transform:'scale(.6)',opacity:0},{transform:'none',opacity:1}],{delay:120+(k++)*STAG,fill:'backwards'});
  });
  $$('.day').forEach(d=>{ if(!oldDays.has(d.dataset.d)) A(d.querySelector('h2'),[{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'none'}],{delay:80,fill:'backwards'}); });
}

/* ===== GÖRÜNTÜLE ===== */
const vw=$('#vw'), vImg=$('#vImg'), vbg=$('#vbg'), bar=$('#bar'), vx=$('#vX');
let cur=null, vlist=[], busyV=false;
function setInfo(i, animate){
  const [m]=dname(i.date);
  $('#vNm').innerHTML=`<i class="av ${i.who}">${P[i.who].h}</i><div>${P[i.who].ad}<small>${m}${i.sure!=null?' · '+fmt(i.sure):''}</small></div>`;
  $('#vDl').download=`${i.date}-${P[i.who].ad}.jpg`; $('#vDl').removeAttribute('href');
  if(animate) A($('#vNm').firstChild,[{transform:'scale(.4)'},{transform:'none'}]);
}
function loadFull(id){ R.child('img/'+id).once('value').then(s=>{ if(cur===id&&s.val()){ vImg.src=s.val(); $('#vDl').href=s.val(); } }); }
const chromeEls=()=>[vx,...bar.children];
function chrome(show){
  const els=chromeEls();
  if(show){
    vbg.style.opacity=1; vbg.animate([{opacity:0},{opacity:1}],{duration:350,easing:'ease-out'});
    els.forEach((x,j)=>{ x.style.opacity=1; A(x,[{transform:'translateY(40px) scale(.7)',opacity:0},{transform:'none',opacity:1}],{delay:STAG*(j+1),fill:'backwards'}); });
  }else{
    const o=getComputedStyle(vbg).opacity; vbg.style.opacity=0; vbg.animate([{opacity:o},{opacity:0}],{duration:300,easing:'ease-out'});
    els.forEach(x=>{ const o2=getComputedStyle(x).opacity; x.style.opacity=0; x.animate([{opacity:o2,transform:'none'},{opacity:0,transform:'translateY(20px) scale(.9)'}],{duration:200,easing:EXIT}); });
  }
}
async function view(id){
  if(busyV||cur) return;
  const card=cardEls.get(id), i=items.find(x=>x.id===id); if(!card||!i) return;
  busyV=true; cur=id; vlist=filtered().map(x=>x.id);
  setInfo(i); vImg.style.opacity=0; vImg.style.transform=''; vImg.src=i.thumb;
  vw.classList.add('on'); pushL();
  try{ await vImg.decode(); }catch(e){}
  const from=card.getBoundingClientRect(), to=vImg.getBoundingClientRect();
  hidden.add(id); card.style.visibility='hidden';
  chrome(true);
  const f=await fly(i.thumb, from, to, 28, 28);
  vImg.style.opacity=1; drop(f); busyV=false;
  loadFull(id);
}
async function closeView(fromPop){
  if(!cur||busyV) return; busyV=true;
  if(fromPop!==true) popL();
  const id=cur; cur=null;
  const from=vImg.getBoundingClientRect(), card=cardEls.get(id), i=items.find(x=>x.id===id);
  chrome(false);
  vImg.style.opacity=0; vImg.style.transform='';
  if(card&&card.isConnected&&i){
    const f=await fly(i.thumb, from, card.getBoundingClientRect(), 28, 28);
    hidden.delete(id); card.style.visibility=''; drop(f);
  }else{ hidden.delete(id); vImg.style.opacity=1; await AX(vImg,[{transform:'none',opacity:1},{transform:'scale(.85)',opacity:0}],{duration:220}).finished; }
  vImg.getAnimations().forEach(a=>a.cancel());
  vw.classList.remove('on'); busyV=false;
}
vx.onclick=()=>closeView();
async function navTo(nid, dir, dx){
  busyV=true;
  const W=innerWidth, old=cur, i=items.find(x=>x.id===nid);
  const pre=new Image(); pre.src=i.thumb; const dec=pre.decode().catch(()=>{});
  await vImg.animate([{transform:`translateX(${dx}px) rotate(${dx/40}deg)`},{transform:`translateX(${-dir*W}px) rotate(${-dir*10}deg)`}],{duration:220,easing:EXIT,fill:'forwards'}).finished;
  const oc=cardEls.get(old); hidden.delete(old); if(oc) oc.style.visibility='';
  const nc=cardEls.get(nid); hidden.add(nid); if(nc){ nc.style.visibility='hidden'; nc.scrollIntoView({block:'nearest'}); }
  cur=nid; setInfo(i,true);
  await dec;
  vImg.getAnimations().forEach(a=>a.cancel()); vImg.style.transform=''; vImg.src=i.thumb;
  A(vImg,[{transform:`translateX(${dir*W*.7}px) rotate(${dir*8}deg)`},{transform:'none'}]);
  busyV=false; loadFull(nid);
}
let vd=null; const vst=$('#vst');
vst.addEventListener('touchstart',e=>{ if(!cur||busyV) return; vd={x:e.touches[0].clientX,y:e.touches[0].clientY,dx:0,dy:0,ax:null,t:Date.now()}; },{passive:true});
vst.addEventListener('touchmove',e=>{
  if(!vd) return;
  const dx=e.touches[0].clientX-vd.x, dy=e.touches[0].clientY-vd.y; vd.dx=dx; vd.dy=dy;
  if(!vd.ax && Math.hypot(dx,dy)>8) vd.ax = Math.abs(dx)>Math.abs(dy)?'x':'y';
  if(vd.ax==='y'){
    const p=Math.min(Math.abs(dy)/380,1);
    vImg.style.transform=`translate(${dx*.6}px,${dy}px) scale(${1-p*.3})`;
    vbg.style.opacity=1-p; chromeEls().forEach(x=>x.style.opacity=Math.max(0,1-p*1.8));
  }else if(vd.ax==='x'){
    const has=vlist[vlist.indexOf(cur)+(dx<0?1:-1)], m=has?dx:dx/4;
    vImg.style.transform=`translateX(${m}px) rotate(${m/40}deg)`;
  }
},{passive:true});
vst.addEventListener('touchend',()=>{
  if(!vd) return; const d=vd; vd=null;
  const back=()=>{ const t=vImg.style.transform; vImg.style.transform=''; if(t) A(vImg,[{transform:t},{transform:'none'}]); vbg.style.opacity=1; chromeEls().forEach(x=>x.style.opacity=1); };
  if(d.ax==='y'){ if(Math.abs(d.dy)>110 || Math.abs(d.dy)/(Date.now()-d.t)>.7) closeView(); else back(); }
  else if(d.ax==='x'){
    const dir=d.dx<0?1:-1, nid=vlist[vlist.indexOf(cur)+dir];
    if(nid && (Math.abs(d.dx)>70 || Math.abs(d.dx)/(Date.now()-d.t)>.5)) navTo(nid,dir,d.dx); else back();
  }
});
$('#vDel').onclick=async()=>{
  if(!cur||busyV||!confirm('silinsin mi?')) return;
  busyV=true; const id=cur; cur=null; popL();
  chrome(false);
  await AX(vImg,[{transform:vImg.style.transform||'none',opacity:1},{transform:'scale(.5)',opacity:0}],{duration:260}).finished;
  vw.classList.remove('on'); vImg.getAnimations().forEach(a=>a.cancel()); vImg.style.transform='';
  busyV=false;
  R.child('meta/'+id).remove().catch(fbErr); R.child('img/'+id).remove().catch(()=>{});
  setTimeout(()=>hidden.delete(id),400);
};

/* ===== EKRAN AÇIK KALSIN ===== */
let wl=null, wantWake=false;
async function wake(on){
  wantWake=on; if(!SET.wake) on=false;
  try{
    if(on && !wl && navigator.wakeLock && document.visibilityState==='visible'){ wl=await navigator.wakeLock.request('screen'); wl.addEventListener('release',()=>wl=null); }
    else if(!on && wl){ const w=wl; wl=null; await w.release(); }
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && wantWake) wake(true); });

/* ===== MASA SAATİ (yatay) ===== */
const mqDesk=matchMedia('(orientation: landscape) and (max-height: 600px)');
function onDesk(anim){
  const d=mqDesk.matches;
  if(d===app.classList.contains('desk') && anim) return;
  app.classList.toggle('desk', d);
  if(d){
    if(cur) closeView(); if(sh.classList.contains('on')) closeSheet(); if($('#setSh').classList.contains('on')) closeSet();
    if(tab==='a' && !switching){ tabsLq.go($('.tab[data-v=t]'), true); tab='t'; vT.style.visibility='visible'; vT.style.zIndex=2; vA.style.zIndex=1; vA.style.visibility='hidden'; }
  }
  requestAnimationFrame(()=>{
    sizeCv(); liquids.forEach(l=>l.sync()); forceDraw=true;
    if(anim){
      aS.x=0; bSc.x=0; g1.x=g2.x=g3.x=.5; aX.snap(); bX.snap();
      A($('#tbox'),[{transform:'scale(.6)',opacity:0},{transform:'none',opacity:1}],{fill:'backwards'});
      A(ctl,[{opacity:0},{opacity:1}],{fill:'backwards'});
    }
  });
}
mqDesk.addEventListener ? mqDesk.addEventListener('change',()=>onDesk(true)) : mqDesk.addListener(()=>onDesk(true));
onDesk(false);

/* ===== GERİ TUŞU ===== */
let ignorePop=0;
function pushL(){ history.pushState({layer:1},''); }
function popL(){ if(history.state&&history.state.layer){ ignorePop++; history.back(); } }
addEventListener('popstate',()=>{
  if(ignorePop){ ignorePop--; return; }
  if(cur) closeView(true); else if(sh.classList.contains('on')) closeSheet(true); else if(setSh.classList.contains('on')) closeSet(true);
});

/* ===== İNDİR / PAYLAŞ (iOS'ta data: indirme çalışmaz) ===== */
$('#vDl').onclick=async e=>{
  e.preventDefault();
  const a=$('#vDl'), src=a.getAttribute('href'); if(!src) return;
  try{
    const blob=await (await fetch(src)).blob(), file=new File([blob], a.download||'cizim.jpg', {type:'image/jpeg'});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file]}); return; }
    const u=URL.createObjectURL(blob), l=document.createElement('a'); l.href=u; l.download=a.download||'cizim.jpg';
    document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000);
  }catch(err){ if(err && err.name!=='AbortError') window.open(src,'_blank'); }
};

applyState(stateOf());
requestAnimationFrame(t=>{ last=t; loop(t); });
/* ===== GİRİŞ / KİMLİK ===== */
let authResolve; const authReady=new Promise(r=>authResolve=r);
setTimeout(()=>authResolve(),7000);
function setMe(w){
  ME=w; OTHER=w==='semih'?'ecrin':'semih';
  const mb=$('#meBtn');
  if(USER&&USER.photoURL){ const im=new Image(); im.referrerPolicy='no-referrer'; im.src=USER.photoURL; im.onerror=()=>mb.textContent=P[ME].h; mb.replaceChildren(im); } else mb.textContent=P[ME].h;
  mb.style.background=`var(--${ME==='semih'?'s':'e'})`;
}
function startData(){
  if(dataOn) return; dataOn=true;
  TR.on('value', onTimer, fbErr);
  R.child('meta').on('value', onMeta, fbErr);
}
function showGate(id){
  $$('.gate').forEach(g=>g.classList.toggle('on', g.id===id)); gateOn=true;
  const g=$('#'+id);
  gg1.x=gg2.x=gg3.x=.4; gkick(1.5);
  const items=id==='gLogin'?[$('#gBtn')]:$$('#gPick .pk button');
  items.forEach((b,k)=>A(b,[{transform:'scale(0)'},{transform:'none'}],{delay:120+k*STAG*2,fill:'backwards'}));
  return g;
}
async function hideGates(){
  const g=$('.gate.on'); if(!g){ gateOn=false; return; }
  [...g.querySelectorAll('.gbtn,.pk button')].forEach(b=>AX(b,[{transform:'none'},{transform:'scale(0)'}],{duration:220}));
  gM.t=0; gg1.t=gg2.t=gg3.t=1.4;
  await wait(200);
  await g.animate([{opacity:1},{opacity:0}],{duration:300,easing:'ease-out',fill:'forwards'}).finished;
  g.classList.remove('on'); g.getAnimations().forEach(a=>a.cancel()); gateOn=false; gM.t=.8; gg1.t=gg2.t=gg3.t=1;
}
function popApp(){
  g1.x=g2.x=g3.x=.4; aS.x=0; bSc.x=0; aX.snap(); bX.snap(); forceDraw=true;
  A($('#tbox'),[{transform:'scale(.7)',opacity:0},{transform:'none',opacity:1}],{fill:'backwards'});
  A($('#tabs'),[{transform:'translateY(120px)'},{transform:'none'}],{delay:STAG*2,fill:'backwards'});
  A($('#meBtn'),[{transform:'scale(0)'},{transform:'none'}],{delay:STAG*3,fill:'backwards'});
}
async function enterApp(){ startData(); paintCtl(); const had=gateOn; await hideGates(); if(had) popApp(); }
async function refreshPick(){
  const ps=(await R.child('people').once('value')).val()||{};
  $$('#gPick .pk button').forEach(b=>b.classList.toggle('taken', !!ps[b.dataset.w] && ps[b.dataset.w]!==USER.uid));
  return ps;
}
function authErr(e){
  const c=(e&&e.code)||'';
  if(/popup-closed|cancelled-popup/.test(c)) return;
  toast(/unauthorized-domain/.test(c)?'bu adres Firebase\'de yetkili değil':/operation-not-allowed/.test(c)?'Google girişi kapalı':'giriş olmadı');
}
auth.getRedirectResult().catch(authErr);
auth.onAuthStateChanged(async u=>{
  USER=u;
  if(!u){ ME=null; authResolve(); await splashGone; showGate('gLogin'); return; }
  try{
    const ps=(await R.child('people').once('value')).val()||{};
    const mine=Object.keys(ps).find(k=>ps[k]===u.uid);
    if(mine) setMe(mine);
    authResolve(); await splashGone;
    if(mine) await enterApp();
    else { await refreshPick(); showGate('gPick'); }
  }catch(e){ authResolve(); await splashGone; fbErr(e); showGate('gLogin'); }
});
$('#gBtn').onclick=async()=>{
  const b=$('#gBtn'); if(b.disabled) return; b.disabled=true; gkick(-2.5); vib(15);
  const pr=new firebase.auth.GoogleAuthProvider(); pr.setCustomParameters({prompt:'select_account'});
  try{
    await auth.signInWithPopup(pr);
  }catch(e){
    if(/popup-blocked|operation-not-supported|web-storage/.test(e.code||'')){ try{ await auth.signInWithRedirect(pr); }catch(e2){ authErr(e2); } }
    else authErr(e);
  }
  b.disabled=false;
};
$$('#gPick .pk button').forEach(b=>b.onclick=async()=>{
  if(!USER) return; const w=b.dataset.w; gkick(-2.5); vib(15);
  try{
    const r=await R.child('people/'+w).transaction(v=> v==null ? USER.uid : undefined);
    if(r.snapshot.val()!==USER.uid){ toast('bu isim alınmış'); refreshPick(); return; }
    setMe(w); await enterApp();
  }catch(e){ fbErr(e); refreshPick(); }
});
const setSh=$('#setSh');
const animLq=new Liquid($('#animSeg'), b=>{ SET.anim=b.dataset.a; saveSet(); vib(10); kick(2); });
($(`#animSeg button[data-a="${SET.anim}"]`)||$('#animSeg button')).classList.add('on');
liquids.push(animLq);
$$('#setSh .sw').forEach(b=>{
  b.classList.toggle('on', !!SET[b.dataset.k]);
  b.onclick=()=>{ const k=b.dataset.k; SET[k]=!SET[k]; saveSet(); b.classList.toggle('on',SET[k]);
    if(k==='vib') vib(30); if(k==='ses'){ beep(988,.12); } if(k==='wake') wake(wantWake); };
});
function openSet(){
  if(setSh.classList.contains('on')||!ME) return;
  const av=$('#pAv'); av.style.background=`var(--${ME==='semih'?'s':'e'})`;
  if(USER&&USER.photoURL){ const im=new Image(); im.referrerPolicy='no-referrer'; im.src=USER.photoURL; im.onerror=()=>av.textContent=P[ME].h; av.replaceChildren(im); } else av.textContent=P[ME].h;
  $('#pNm').textContent=P[ME].ad; $('#pMail').textContent=(USER&&USER.email)||'';
  app.classList.add('rnd','back'); setSh.classList.add('on'); ov.classList.add('on'); pushL();
  [...setSh.children].forEach((c,j)=>A(c,[{transform:'translateY(40px)',opacity:0},{transform:'none',opacity:1}],{delay:j*STAG*.8,fill:'backwards'}));
  requestAnimationFrame(()=>animLq.go($(`#animSeg button[data-a="${SET.anim}"]`)||$('#animSeg button'), true));
}
function closeSet(fromPop){
  if(!setSh.classList.contains('on')) return;
  if(fromPop!==true) popL();
  setSh.classList.remove('on'); ov.classList.remove('on'); app.classList.remove('back');
  setTimeout(()=>{ if(!app.classList.contains('back')) app.classList.remove('rnd'); },600);
}
bindDrag(setSh, ()=>closeSet());
$('#meBtn').onclick=()=>{ A($('#meBtn'),[{transform:'scale(.8)'},{transform:'none'}]); openSet(); };
$('#bOut').onclick=async()=>{ if(confirm('çıkış yapılsın mı?')){ await auth.signOut(); location.reload(); } };

/* ===== AÇILIŞ ===== */
let started=false, splashGoneRes; const splashGone=new Promise(r=>splashGoneRes=r);
const start=async()=>{ if(started) return; started=true;
  await authReady;
  sizeCv(); liquids.forEach(l=>l.sync());
  const s=$('#splash'), orb=s.querySelector('.orb');
  const rot=getComputedStyle(orb).transform; orb.style.animation='none'; orb.style.transform=rot==='none'?'':rot;
  [...orb.children].forEach(d=>AX(d,[{transform:getComputedStyle(d).transform},{transform:'translate(0,0) scale(1.4)'}],{duration:380}));
  await wait(360);
  if(ME) popApp();
  s.animate([{opacity:1},{opacity:0}],{duration:260,easing:'linear',fill:'forwards'}).onfinish=()=>s.remove();
  splashGoneRes();
};
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>setTimeout(start,250));
setTimeout(start,1800);
